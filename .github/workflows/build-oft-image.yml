name: build-oft-image

# Builds the OpenVLA-OFT + LIBERO image on GitHub's runners (no local machine /
# GPU needed) and pushes it to GitHub Container Registry (GHCR).
#
# Setup (one time):
#   - This workflow uses the built-in GITHUB_TOKEN; no secrets needed for GHCR.
#   - After first push, make the package public (or add RunPod registry creds)
#     so RunPod can pull it: GitHub -> Packages -> your image -> Package settings.
#
# Trigger: manually (Actions tab -> Run workflow) or on push to this path.

on:
  workflow_dispatch:
  push:
    paths:
      - "04_vla_libero_grpo/Dockerfile"
      - ".github/workflows/build-oft-image.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk (image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          df -h

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: ./04_vla_libero_grpo
          file: ./04_vla_libero_grpo/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/openvla-oft-libero:cu128
